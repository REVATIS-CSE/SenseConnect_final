# XcodeGen project definition for the SenseConnect iPhone app.
# On a Mac:  brew install xcodegen && cd ios && xcodegen generate && open SenseConnect.xcodeproj
name: SenseConnect
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Set your Apple ID team here or in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
targets:
  SenseConnect:
    type: application
    platform: iOS
    sources:
      - path: SenseConnect
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.senseconnect
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # Permission texts and launch screen live in this file (HTTPS only, no ATS exceptions).
        INFOPLIST_FILE: SenseConnect/Info.plist
  SenseConnectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SenseConnectTests
    dependencies:
      - target: SenseConnect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.senseconnect.tests
schemes:
  SenseConnect:
    build:
      targets:
        SenseConnect: all
        SenseConnectTests: [test]
    test:
      targets:
        - SenseConnectTests
